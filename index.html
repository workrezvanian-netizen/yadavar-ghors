<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>یادآور قرص</title>
<meta name="description" content="یادآوری زمان مصرف داروها" />
<meta name="theme-color" content="#1F6F6B" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6F5;
    --surface:#FFFFFF;
    --ink:#16302D;
    --ink-soft:#5B7570;
    --line:#DCE6E4;
    --primary:#1F6F6B;
    --primary-deep:#154E4B;
    --primary-ink:#F3F6F5;
    --gold:#D9A441;
    --dawn:#8B7FC7;
    --morning:#D9A441;
    --noon:#E2A63C;
    --evening:#C9673F;
    --night:#2C3E70;
    --danger:#B4483C;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px -14px rgba(22,48,45,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', Tahoma, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }
  /* ---------- header ---------- */
  header.top{
    padding:22px 20px 18px;
    background:linear-gradient(160deg, var(--primary) 0%, var(--primary-deep) 100%);
    color:var(--primary-ink);
    border-radius:0 0 28px 28px;
    box-shadow:var(--shadow);
  }
  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 10px;
  }
  .brand-logo{
    display:block;
    height:32px;
    width:auto;
    margin:0;
    opacity:0.95;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));
  }
  .header-settings-btn{
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.16);
    border:none; color:var(--primary-ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
    transition:background .15s, transform .15s;
  }
  .header-settings-btn:active{ transform:scale(0.92); background:rgba(255,255,255,0.28); }
  .header-settings-btn svg{ width:18px; height:18px; }
  .eyebrow{
    font-size:12.5px;
    letter-spacing:0.06em;
    opacity:0.75;
    font-weight:500;
    margin:0 0 4px;
  }
  h1.title{
    font-size:24px;
    font-weight:800;
    margin:0 0 18px;
  }
  .adherence-line{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    opacity:0.9;
  }
  .adherence-track{
    flex:1;
    height:6px;
    background:rgba(255,255,255,0.22);
    border-radius:99px;
    overflow:hidden;
  }
  .adherence-fill{
    height:100%;
    background:var(--gold);
    border-radius:99px;
    transition:width .4s ease;
  }

  /* ---------- day arc (signature element) ---------- */
  .dayarc-wrap{
    margin:16px -4px -6px;
  }
  .dayarc-wrap svg{ display:block; width:100%; height:auto; }
  .dayarc-labels{
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    opacity:0.7;
    padding:2px 6px 0;
  }

  /* ---------- tabs ---------- */
  nav.tabs{
    display:flex;
    gap:6px;
    padding:14px 16px 6px;
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:9px 6px;
    border-radius:99px;
    cursor:pointer;
    transition:background .2s,color .2s;
  }
  nav.tabs button.active{
    background:var(--surface);
    color:var(--primary);
    box-shadow:var(--shadow);
  }

  main{
    flex:1;
    padding:6px 16px 110px;
  }
  section.view{ display:none; }
  section.view.active{ display:block; }

  /* ---------- section groups (time-of-day) ---------- */
  .zone{ margin-top:22px; }
  .zone:first-child{ margin-top:8px; }
  .zone-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 2px 10px;
  }
  .zone-dot{ width:9px; height:9px; border-radius:50%; }
  .zone-title{ font-size:14px; font-weight:700; color:var(--ink); }
  .zone-count{ font-size:12px; color:var(--ink-soft); margin-inline-start:auto; }

  .dose-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:13px 14px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    border-inline-start:5px solid var(--pill-color, var(--primary));
  }
  .dose-card.taken{ opacity:0.55; }
  .dose-swatch{
    width:38px; height:38px; border-radius:12px;
    background:var(--pill-color, var(--primary));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-size:16px; flex:none;
  }
  .dose-swatch svg{ width:20px; height:20px; }
  .dose-info{ flex:1; min-width:0; }
  .dose-name{ font-size:15px; font-weight:700; margin:0 0 2px; }
  .dose-name.strike{ text-decoration:line-through; text-decoration-color:var(--ink-soft); }
  .dose-meta{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .dose-time{ font-size:13px; font-weight:700; color:var(--primary); direction:ltr; text-align:left; }
  .check-btn{
    width:32px; height:32px; border-radius:50%;
    border:2px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex:none; color:transparent;
    transition:.15s;
  }
  .check-btn.on{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; line-height:1.9; margin:0 0 16px; }

  /* ---------- meds list ---------- */
  .med-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border-radius:var(--radius-md);
    padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .med-row .times{ font-size:12px; color:var(--ink-soft); direction:ltr; text-align:left; }
  .icon-btn{
    border:none; background:var(--bg); width:34px; height:34px;
    border-radius:10px; display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--ink-soft); flex:none; font-size:15px;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    inset-inline-end:calc(50% - 240px + 22px);
    bottom:96px;
    width:56px;height:56px;border-radius:50%;
    background:var(--gold);
    color:var(--ink);
    border:none;
    font-size:26px;
    box-shadow:0 12px 24px -8px rgba(217,164,65,0.6);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  @media (max-width:480px){
    .fab{ inset-inline-end:22px; }
  }

  /* ---------- bottom tab bar ---------- */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px; margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index:15;
  }
  .tabbar button{
    flex:1; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-family:inherit; font-size:11px; font-weight:600;
    padding:4px;
  }
  .tabbar button .ic{ font-size:19px; display:flex; }
  .tabbar button .ic svg{ width:21px; height:21px; stroke-width:2; }
  .tabbar button.active{ color:var(--primary); }

  /* ---------- settings ---------- */
  .card{
    background:var(--surface); border-radius:var(--radius-md);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h3{ font-size:14.5px; margin:0 0 6px; }
  .card p{ font-size:13px; color:var(--ink-soft); line-height:1.9; margin:0 0 10px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .btn{
    border:none; border-radius:99px; padding:10px 18px;
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-ghost{ background:var(--bg); color:var(--ink); }
  .status-pill{
    font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:99px;
  }
  .status-on{ background:#E4F1EE; color:var(--primary); }
  .status-off{ background:#F4E4E1; color:var(--danger); }

  /* ---------- modal / sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(22,48,45,0.45);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--bg);
    width:100%; max-width:480px;
    border-radius:26px 26px 0 0;
    max-height:88vh;
    overflow-y:auto;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 40px -10px rgba(22,48,45,0.35);
  }
  .sheet-handle{
    width:40px; height:5px; background:var(--line); border-radius:99px;
    margin:0 auto 16px;
  }
  .sheet h2{ font-size:18px; margin:0 0 16px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .field input[type=text], .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; font-family:inherit; font-size:14.5px; background:var(--surface); color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .color-picker{ display:flex; gap:10px; }
  .swatch-opt{
    width:34px; height:34px; border-radius:10px; cursor:pointer; border:2.5px solid transparent;
  }
  .swatch-opt.sel{ border-color:var(--ink); }
  .shape-picker{ display:flex; flex-wrap:wrap; gap:9px; }
  .shape-opt{
    width:46px; height:46px; border-radius:13px; cursor:pointer;
    border:2px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); transition:.15s;
  }
  .shape-opt svg{ width:23px; height:23px; }
  .shape-opt.sel{ border-color:var(--primary); background:var(--bg); color:var(--primary); }
  .time-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .time-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1.5px solid var(--line); border-radius:99px;
    padding:6px 6px 6px 12px; font-size:13px; direction:ltr;
  }
  .time-chip button{
    border:none; background:var(--bg); width:20px; height:20px; border-radius:50%;
    color:var(--ink-soft); cursor:pointer; font-size:12px; line-height:1;
  }
  .add-time-row{ display:flex; gap:8px; align-items:center; }
  .add-time-row input[type=time]{
    flex:1; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 10px; font-family:inherit; font-size:14px; background:var(--surface); color:var(--ink);
  }
  .days-grid{ display:flex; gap:6px; flex-wrap:wrap; }
  .day-opt{
    border:1.5px solid var(--line); background:var(--surface); border-radius:10px;
    padding:8px 0; width:42px; text-align:center; font-size:12px; cursor:pointer; color:var(--ink-soft);
  }
  .day-opt.sel{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn{ flex:1; }

  /* ---------- quick settings sheet ---------- */
  .qs-card{
    background:var(--surface); border-radius:var(--radius-md);
    padding:6px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .qs-card h3{ font-size:12.5px; color:var(--ink-soft); font-weight:700; margin:10px 12px 6px; }
  .qs-row{
    display:flex; align-items:center; gap:10px;
    width:100%; border:none; background:transparent;
    font-family:inherit; font-size:14px; font-weight:600; color:var(--ink);
    padding:12px 10px; border-radius:12px; cursor:pointer; text-align:right;
    transition:background .15s;
  }
  .qs-row:active{ background:var(--bg); }
  .qs-icon-badge{
    width:32px; height:32px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--primary);
  }
  .qs-icon-badge svg{ width:17px; height:17px; }
  .qs-version{
    text-align:center; font-size:12px; color:var(--ink-soft);
    margin:0 0 18px;
  }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px;
    font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="header-row">
      <button class="header-settings-btn" id="header-settings-btn" aria-label="تنظیمات سریع" data-icon="settings"></button>
      <img src="assets/logo-nelin.png" alt="Nelin" class="brand-logo" />
    </div>
    <p class="eyebrow" id="eyebrow-date">—</p>
    <h1 class="title">یادآور قرص</h1>
    <div class="adherence-line">
      <span id="adherence-label">۰ از ۰ دوز امروز</span>
      <span class="adherence-track"><span class="adherence-fill" id="adherence-fill" style="width:0%"></span></span>
    </div>
    <div class="dayarc-wrap">
      <svg id="dayarc-svg" viewBox="0 0 440 70" preserveAspectRatio="none"></svg>
      <div class="dayarc-labels"><span>۰۰:۰۰</span><span>۰۶:۰۰</span><span>۱۲:۰۰</span><span>۱۸:۰۰</span><span>۲۴:۰۰</span></div>
    </div>
  </header>

  <main>
    <!-- امروز -->
    <section class="view active" id="view-today"></section>

    <!-- داروها -->
    <section class="view" id="view-meds"></section>
  </main>

  <button class="fab" id="fab-add" aria-label="افزودن دارو">＋</button>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="today"><span class="ic" data-icon="today"></span>امروز</button>
    <button class="tab-btn" data-tab="meds"><span class="ic" data-icon="meds"></span>داروها</button>
  </nav>

  <div class="overlay" id="qs-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>تنظیمات</h2>
      <div id="qs-dynamic"></div>
      <div class="qs-card">
        <h3>اقدامات سریع</h3>
        <button type="button" class="qs-row" id="qs-test-btn">
          <span class="qs-icon-badge" data-icon="bell"></span>
          تست یادآوری
        </button>
        <button type="button" class="qs-row" id="qs-reenable-btn">
          <span class="qs-icon-badge" data-icon="refresh"></span>
          فعال‌سازی مجدد نوتیفیکیشن
        </button>
      </div>
      <p class="qs-version">نسخه‌ی نرم‌افزار ۱.۰۱</p>
      <button type="button" class="btn btn-primary" id="qs-close-btn" style="width:100%">بستن</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 id="sheet-title">داروی جدید</h2>
      <form id="med-form">
        <div class="field">
          <label for="f-name">نام دارو</label>
          <input type="text" id="f-name" placeholder="مثلاً متفورمین" required />
        </div>
        <div class="field">
          <label for="f-dosage">مقدار مصرف</label>
          <input type="text" id="f-dosage" placeholder="مثلاً ۱ قرص، ۵۰۰ میلی‌گرم" />
        </div>
        <div class="field">
          <label>رنگ برچسب</label>
          <div class="color-picker" id="color-picker"></div>
        </div>
        <div class="field">
          <label>شکل دارو</label>
          <div class="shape-picker" id="shape-picker"></div>
        </div>
        <div class="field">
          <label>ساعت‌های مصرف</label>
          <div class="time-chips" id="time-chips"></div>
          <div class="add-time-row">
            <input type="time" id="f-time-input" value="08:00" />
            <button type="button" class="btn btn-ghost" id="add-time-btn">افزودن ساعت</button>
          </div>
        </div>
        <div class="field">
          <label>روزهای مصرف</label>
          <div class="days-grid" id="days-grid"></div>
        </div>
        <div class="field">
          <label for="f-notes">یادداشت (اختیاری)</label>
          <textarea id="f-notes" placeholder="مثلاً همراه با غذا میل شود"></textarea>
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn btn-ghost" id="cancel-btn">انصراف</button>
          <button type="submit" class="btn btn-primary" id="save-btn">ذخیره دارو</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= داده و ذخیره‌سازی ================= */
const STORAGE_KEY = "yadavar-ghors-meds-v1";
const LOG_KEY = "yadavar-ghors-log-v1";
const COLORS = ["#1F6F6B", "#D9A441", "#8B7FC7", "#C9673F", "#2C3E70", "#4E8C6B"];
const WEEKDAYS = [
  {v:6, label:"ش"}, {v:0, label:"ی"}, {v:1, label:"د"}, {v:2, label:"س"},
  {v:3, label:"چ"}, {v:4, label:"پ"}, {v:5, label:"ج"}
]; // Date.getDay(): 0=یکشنبه ... 6=شنبه

const persianDigits = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function toFa(n){ return String(n).replace(/[0-9]/g, d => persianDigits[d]); }

const faDateFmt = new Intl.DateTimeFormat("fa-IR", { weekday:"long", day:"numeric", month:"long" });

function loadMeds(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function saveMeds(meds){ localStorage.setItem(STORAGE_KEY, JSON.stringify(meds)); }
function loadLog(){
  try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveLog(log){ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }

/* ================= آیکون‌ها ================= */
const ICONS = {
  today: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
    </svg>`,
  meds: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.3" y="9.5" width="17.4" height="7" rx="3.5" transform="rotate(-35 12 12)"/>
      <line x1="12" y1="7.3" x2="12" y2="16.7" transform="rotate(-35 12 12)"/>
    </svg>`,
  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.8a7.6 7.6 0 0 0-2.6-1.5L14 2.3h-4l-.5 2.6a7.6 7.6 0 0 0-2.6 1.5l-2.3-.8-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.8c.77.66 1.65 1.17 2.6 1.5l.5 2.6h4l.5-2.6a7.6 7.6 0 0 0 2.6-1.5l2.3.8 2-3.4-2-1.5Z"/>
    </svg>`,
  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

const SHAPES = [
  {v:"tablet", label:"قرص گرد"},

let meds = loadMeds();
let log = loadLog();

function todayKey(d = new Date()){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function doseKey(medId, time, d = new Date()){ return todayKey(d) + "|" + medId + "|" + time; }

/* ================= منطقه‌های زمانی روز ================= */
function zoneOf(hhmm){
  const h = parseInt(hhmm.split(":")[0], 10);
  if (h >= 5 && h < 12) return {id:"dawn", label:"صبح", color:"var(--dawn)"};
  if (h >= 12 && h < 17) return {id:"noon", label:"ظهر", color:"var(--noon)"};
  if (h >= 17 && h < 21) return {id:"evening", label:"عصر", color:"var(--evening)"};
  return {id:"night", label:"شب", color:"var(--night)"};
}
const ZONE_ORDER = ["dawn","noon","evening","night"];
const ZONE_META = {
  dawn:{label:"صبح", color:"#D9A441"},
  noon:{label:"ظهر", color:"#E2A63C"},
  evening:{label:"عصر", color:"#C9673F"},
  night:{label:"شب", color:"#2C3E70"}
};

function medActiveToday(med, d = new Date()){
  if (!med.days || med.days === "daily") return true;
  return med.days.includes(d.getDay());
}

function todaysDoses(){
  const d = new Date();
  const out = [];
  meds.forEach(med => {
    if (!medActiveToday(med, d)) return;
    (med.times || []).forEach(t => {
      out.push({ med, time:t, zone: zoneOf(t).id });
    });
  });
  out.sort((a,b) => a.time.localeCompare(b.time));
  return out;
}

/* ================= رندر: خط روز (عنصر شاخص) ================= */
function renderDayArc(){
  const svg = document.getElementById("dayarc-svg");
  const W = 440, H = 70, baseY = 46, amp = 30;
  const pathPts = [];
  for (let h = 0; h <= 24; h += 1){
    const x = W * (1 - h/24);
    const y = baseY - amp * Math.sin(Math.PI * h/24);
    pathPts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  const doses = todaysDoses();
  const now = new Date();
  const nowH = now.getHours() + now.getMinutes()/60;
  const nowX = W * (1 - nowH/24);
  const nowY = baseY - amp * Math.sin(Math.PI * nowH/24);

  let dots = "";
  doses.forEach(ds => {
    const [hh,mm] = ds.time.split(":").map(Number);
    const hDec = hh + mm/60;
    const x = W * (1 - hDec/24);
    const y = baseY - amp * Math.sin(Math.PI * hDec/24);
    const taken = !!log[doseKey(ds.med.id, ds.time)];
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${taken ? 'rgba(255,255,255,0.45)' : ds.med.color}" stroke="#fff" stroke-width="1.6"/>`;
  });

  svg.innerHTML = `
    <defs>
      <linearGradient id="arcGrad" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#D9A441"/>
        <stop offset="35%" stop-color="#E2A63C"/>
        <stop offset="65%" stop-color="#C9673F"/>
        <stop offset="100%" stop-color="#2C3E70"/>
      </linearGradient>
    </defs>
    <polyline points="${pathPts.join(' ')}" fill="none" stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <circle cx="${nowX.toFixed(1)}" cy="${nowY.toFixed(1)}" r="4" fill="#fff"/>
    <line x1="${nowX.toFixed(1)}" y1="0" x2="${nowX.toFixed(1)}" y2="${H}" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
    ${dots}
  `;
}

/* ================= رندر: تب امروز ================= */
function renderToday(){
  const el = document.getElementById("view-today");
  const doses = todaysDoses();

  document.getElementById("eyebrow-date").textContent = faDateFmt.format(new Date());

  const takenCount = doses.filter(ds => !!log[doseKey(ds.med.id, ds.time)]).length;
  document.getElementById("adherence-label").textContent = `${toFa(takenCount)} از ${toFa(doses.length)} دوز امروز`;
  document.getElementById("adherence-fill").style.width = doses.length ? `${(takenCount/doses.length)*100}%` : "0%";

  renderDayArc();

  if (!doses.length){
    el.innerHTML = `
      <div class="empty-state">
        <div class="glyph">🌤</div>
        <p>هنوز دارویی برای امروز ثبت نشده.<br/>با دکمهٔ زیر اولین دارو را اضافه کن.</p>
      </div>`;
    return;
  }

  let html = "";
  ZONE_ORDER.forEach(zoneId => {
    const zoneDoses = doses.filter(d => d.zone === zoneId);
    if (!zoneDoses.length) return;
    const meta = ZONE_META[zoneId];
    html += `<div class="zone">
      <div class="zone-head">
        <span class="zone-dot" style="background:${meta.color}"></span>
        <span class="zone-title">${meta.label}</span>
        <span class="zone-count">${toFa(zoneDoses.length)} دارو</span>
      </div>`;
    zoneDoses.forEach(ds => {
      const key = doseKey(ds.med.id, ds.time);
      const taken = !!log[key];
      html += `
        <div class="dose-card ${taken ? 'taken':''}" style="--pill-color:${ds.med.color}">
          <div class="dose-swatch">${SHAPE_ICONS[ds.med.shape] || SHAPE_ICONS.tablet}</div>
          <div class="dose-info">
            <p class="dose-name ${taken ? 'strike':''}">${escapeHtml(ds.med.name)}</p>
            <p class="dose-meta">${escapeHtml(ds.med.dosage || 'بدون توضیح مقدار')}</p>
          </div>
          <div class="dose-time">${toFa(ds.time)}</div>
          <button class="check-btn ${taken ? 'on':''}" data-dosekey="${key}" aria-label="ثبت مصرف">✓</button>
        </div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html;

  el.querySelectorAll(".check-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.dosekey;
      if (log[key]) delete log[key]; else log[key] = Date.now();
      saveLog(log);
      renderToday();
    });
  });
}

function escapeHtml(s){
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ================= رندر: تب داروها ================= */
function renderMeds(){
  const el = document.getElementById("view-meds");
  if (!meds.length){
    el.innerHTML = `
      <div class="empty-state">
        <div class="glyph">💊</div>
        <p>هنوز دارویی اضافه نکرده‌ای.<br/>برای شروع، دکمهٔ افزودن را بزن.</p>
      </div>`;
    return;
  }
  let html = "";
  meds.forEach(med => {
    const timesTxt = (med.times || []).slice().sort().map(toFa).join(" · ");
    const daysTxt = (!med.days || med.days === "daily") ? "هر روز" :
      WEEKDAYS.filter(w => med.days.includes(w.v)).map(w => w.label).join(" ");
    html += `
      <div class="med-row" style="border-inline-start:5px solid ${med.color}">
        <div class="dose-swatch" style="background:${med.color}">${SHAPE_ICONS[med.shape] || SHAPE_ICONS.tablet}</div>
        <div class="dose-info">
          <p class="dose-name">${escapeHtml(med.name)}</p>
          <p class="dose-meta">${escapeHtml(med.dosage || "")} ${med.dosage ? "·" : ""} ${daysTxt}</p>
          <p class="times">${timesTxt}</p>
        </div>
        <button class="icon-btn" data-edit="${med.id}" aria-label="ویرایش">✎</button>
        <button class="icon-btn" data-del="${med.id}" aria-label="حذف">🗑</button>
      </div>`;
  });
  el.innerHTML = html;

  el.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.edit)));
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (confirm("این دارو حذف شود؟")){
      meds = meds.filter(m => m.id !== b.dataset.del);
      saveMeds(meds);
      renderAll();
      showToast("دارو حذف شد");
    }
  }));
}

/* ================= فرم افزودن/ویرایش دارو ================= */
let editingId = null;
let draftTimes = [];
let draftColor = COLORS[0];
let draftShape = "tablet";
let draftDays = "daily";

function buildColorPicker(){
  const wrap = document.getElementById("color-picker");
  wrap.innerHTML = COLORS.map(c =>
    `<div class="swatch-opt ${c === draftColor ? 'sel':''}" data-color="${c}" style="background:${c}"></div>`
  ).join("");
  wrap.querySelectorAll(".swatch-opt").forEach(s => s.addEventListener("click", () => {
    draftColor = s.dataset.color;
    buildColorPicker();
  }));
}

function buildShapePicker(){
  const wrap = document.getElementById("shape-picker");
  wrap.innerHTML = SHAPES.map(s =>
    `<div class="shape-opt ${s.v === draftShape ? 'sel':''}" data-shape="${s.v}" aria-label="${s.label}" title="${s.label}">${SHAPE_ICONS[s.v]}</div>`
  ).join("");
  wrap.querySelectorAll(".shape-opt").forEach(s => s.addEventListener("click", () => {
    draftShape = s.dataset.shape;
    buildShapePicker();
  }));
}

function buildDaysGrid(){
  const wrap = document.getElementById("days-grid");
  wrap.innerHTML = WEEKDAYS.map(w => {
    const sel = draftDays === "daily" || (Array.isArray(draftDays) && draftDays.includes(w.v));
    return `<div class="day-opt ${sel ? 'sel':''}" data-day="${w.v}">${w.label}</div>`;
  }).join("");
  wrap.querySelectorAll(".day-opt").forEach(d => d.addEventListener("click", () => {
    const v = Number(d.dataset.day);
    if (draftDays === "daily") draftDays = WEEKDAYS.map(w => w.v);
    if (draftDays.includes(v)){
      draftDays = draftDays.filter(x => x !== v);
    } else {
      draftDays = [...draftDays, v];
    }
    if (draftDays.length === 7) draftDays = "daily";
    buildDaysGrid();
  }));
}

function buildTimeChips(){
  const wrap = document.getElementById("time-chips");
  if (!draftTimes.length){
    wrap.innerHTML = `<span style="font-size:12.5px;color:var(--ink-soft)">هنوز ساعتی اضافه نشده</span>`;
    return;
  }
  wrap.innerHTML = draftTimes.slice().sort().map(t =>
    `<span class="time-chip">${toFa(t)}<button type="button" data-t="${t}">×</button></span>`
  ).join("");
  wrap.querySelectorAll("button[data-t]").forEach(b => b.addEventListener("click", () => {
    draftTimes = draftTimes.filter(t => t !== b.dataset.t);
    buildTimeChips();
  }));
}

function openSheet(medId){
  editingId = medId || null;
  const med = editingId ? meds.find(m => m.id === editingId) : null;

  document.getElementById("sheet-title").textContent = med ? "ویرایش دارو" : "داروی جدید";
  document.getElementById("f-name").value = med ? med.name : "";
  document.getElementById("f-dosage").value = med ? med.dosage || "" : "";
  document.getElementById("f-notes").value = med ? med.notes || "" : "";
  draftTimes = med ? [...(med.times || [])] : [];
  draftColor = med ? med.color : COLORS[meds.length % COLORS.length];
  draftShape = med ? (med.shape || "tablet") : "tablet";
  draftDays = med ? med.days : "daily";

  buildColorPicker();
  buildShapePicker();
  buildDaysGrid();
  buildTimeChips();

  document.getElementById("overlay").classList.add("open");
}

function closeSheet(){
  document.getElementById("overlay").classList.remove("open");
  editingId = null;
}

document.getElementById("add-time-btn").addEventListener("click", () => {
  const v = document.getElementById("f-time-input").value;
  if (v && !draftTimes.includes(v)){
    draftTimes.push(v);
    buildTimeChips();
  }
});

document.getElementById("cancel-btn").addEventListener("click", closeSheet);
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeSheet();
});

document.getElementById("med-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = document.getElementById("f-name").value.trim();
  if (!name){ return; }
  if (!draftTimes.length){
    const pending = document.getElementById("f-time-input").value;
    if (pending) draftTimes.push(pending);
  }
  if (!draftTimes.length){ showToast("حداقل یک ساعت مصرف اضافه کن"); return; }

  if (editingId){
    const med = meds.find(m => m.id === editingId);
    med.name = name;
    med.dosage = document.getElementById("f-dosage").value.trim();
    med.notes = document.getElementById("f-notes").value.trim();
    med.times = draftTimes;
    med.color = draftColor;
    med.shape = draftShape;
    med.days = draftDays;
  } else {
    meds.push({
      id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name,
      dosage: document.getElementById("f-dosage").value.trim(),
      notes: document.getElementById("f-notes").value.trim(),
      times: draftTimes,
      color: draftColor,
      shape: draftShape,
      days: draftDays,
      createdAt: Date.now()
    });
  }
  saveMeds(meds);
  closeSheet();
  renderAll();
  showToast("دارو ذخیره شد");
});

  if (Notification.permission !== "granted"){
    const res = await Notification.requestPermission();
    if (res !== "granted"){ showToast("اجازهٔ اعلان داده نشد"); return; }
  }
  const title = "یادآور قرص — تست";
  const body = "این یک اعلان آزمایشی است. اگر این را می‌بینی، اعلان‌ها درست کار می‌کنند.";
  if (navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({ type:"SHOW_REMINDER", title, body, tag:"test-notif" });
  } else {
    new Notification(title, { body, icon:"icons/icon-192.png" });
  }
  showToast("اعلان تست ارسال شد");

document.getElementById("qs-reenable-btn").addEventListener("click", async () => {
  if (!("Notification" in window)){ showToast("این مرورگر از اعلان پشتیبانی نمی‌کند"); return; }
  try{
    if ("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      await navigator.serviceWorker.register("sw.js");
    }
  } catch(e){ /* ignore, still try permission */ }
  const res = await Notification.requestPermission();
  renderQuickSettings();
  if (res === "granted") showToast("نوتیفیکیشن دوباره فعال شد");
  else showToast("اجازهٔ اعلان داده نشد");
});

/* ================= بررسی دوره‌ای برای اعلان ================= */
let notifiedThisMinute = new Set();
function checkDueReminders(){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  meds.forEach(med => {
    if (!medActiveToday(med, now)) return;
    (med.times || []).forEach(t => {
      if (t !== hhmm) return;
      const key = doseKey(med.id, t) + "|notif";
      if (notifiedThisMinute.has(key)) return;
      notifiedThisMinute.add(key);
      const title = "وقت مصرف " + med.name;
      const body = (med.dosage || "") + (med.notes ? " — " + med.notes : "");
      if (navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.controller.postMessage({
          type:"SHOW_REMINDER", title, body, tag:key, doseId:key
        });
      } else if (Notification.permission === "granted"){
        new Notification(title, { body, icon:"icons/icon-192.png" });
      }
    });
  });
}
setInterval(checkDueReminders, 20000);
setInterval(() => { if (document.getElementById("view-today").classList.contains("active")) renderToday(); }, 30000);

/* ================= service worker ================= */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ================= نصب PWA ================= */
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (document.getElementById("qs-overlay").classList.contains("open")) renderQuickSettings();
});
